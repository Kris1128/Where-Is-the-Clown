<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Is the Clown? — 小丑方位介词互动游戏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #2a1f4a 0%, #0e0a1a 65%);
    color: #fff;
    height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    -webkit-tap-highlight-color: transparent;
  }

  .screen { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }

  /* ============ 开始 / 结束页 ============ */
  #startScreen, #endScreen {
    justify-content: center; text-align: center; gap: 16px;
    padding: 20px;
  }
  .logo { font-size: 84px; line-height: 1; filter: drop-shadow(0 10px 24px rgba(167,139,250,.45)); animation: float 2.6s ease-in-out infinite; }
  @keyframes float { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-12px) } }
  h1 { font-size: clamp(32px, 5vh, 56px); letter-spacing: 1px; background: linear-gradient(90deg,#fbbf24,#f472b6,#a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #b9aee0; font-size: clamp(15px, 2.5vh, 20px); }
  .prep-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 800px; margin: 4px 0; }
  .prep-chips span {
    padding: 6px 16px; border-radius: 999px; font-size: clamp(13px, 2vh, 16px); font-weight: 700;
    background: rgba(167,139,250,.14); border: 1px solid rgba(167,139,250,.4); color: #c4b5fd;
  }

  .mode-list { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .mode-card {
    width: clamp(200px, 26vw, 280px); padding: clamp(18px, 3vh, 28px) 20px;
    border-radius: 22px; border: 3px solid transparent;
    cursor: pointer; font-family: inherit; color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: transform .18s, box-shadow .18s, border-color .18s;
    text-align: center;
  }
  .mode-card .icon { font-size: clamp(36px, 5vh, 54px); line-height: 1; }
  .mode-card .title { font-size: clamp(18px, 3vh, 24px); font-weight: 900; letter-spacing: .5px; }
  .mode-card .desc { font-size: clamp(12px, 1.8vh, 15px); line-height: 1.5; opacity: .85; font-weight: 600; }

  .mode-card.drag {
    background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 55%, #d97706 100%);
    color: #2a1704; box-shadow: 0 8px 0 #92400e, 0 16px 32px rgba(245,158,11,.35); border-color: #fde68a;
  }
  .mode-card.drag .desc { opacity: .8; }
  .mode-card.drag:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #92400e, 0 22px 40px rgba(245,158,11,.45); }
  .mode-card.drag:active { transform: translateY(4px); box-shadow: 0 4px 0 #92400e; }

  .mode-card.pick {
    background: linear-gradient(180deg, #a78bfa 0%, #8b5cf6 55%, #6d28d9 100%);
    color: #1a1030; box-shadow: 0 8px 0 #4c1d95, 0 16px 32px rgba(139,92,246,.35); border-color: #ddd6fe;
  }
  .mode-card.pick:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #4c1d95, 0 22px 40px rgba(139,92,246,.45); }
  .mode-card.pick:active { transform: translateY(4px); box-shadow: 0 4px 0 #4c1d95; }

  .mode-card.free {
    background: linear-gradient(180deg, #4ade80 0%, #22c55e 55%, #15803d 100%);
    color: #052e16; box-shadow: 0 8px 0 #14532d, 0 16px 32px rgba(34,197,94,.35); border-color: #bbf7d0;
  }
  .mode-card.free:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #14532d, 0 22px 40px rgba(34,197,94,.45); }
  .mode-card.free:active { transform: translateY(4px); box-shadow: 0 4px 0 #14532d; }

  .btn { border: none; cursor: pointer; font-family: inherit; font-weight: 800; border-radius: 16px; transition: .18s; }
  .btn.primary {
    padding: clamp(14px, 2vh, 20px) clamp(40px, 6vw, 64px); font-size: clamp(20px, 3vh, 26px); color: #1a1030;
    background: linear-gradient(180deg,#fde68a,#f59e0b);
    box-shadow: 0 8px 0 #b45309, 0 14px 28px rgba(245,158,11,.35);
  }
  .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #b45309, 0 18px 32px rgba(245,158,11,.45); }
  .btn.primary:active { transform: translateY(5px); box-shadow: 0 3px 0 #b45309; }
  .btn.ghost {
    padding: clamp(14px, 2vh, 20px) clamp(30px, 4vw, 48px); font-size: clamp(18px, 2.5vh, 22px); color: #c4b5fd;
    background: rgba(167,139,250,.12); border: 2px solid rgba(167,139,250,.5);
  }
  .btn.ghost:hover { background: rgba(167,139,250,.26); transform: translateY(-2px); }
  .btn.ghost:active { transform: translateY(2px); }

  .hint { color: #7c6fa8; font-size: clamp(13px, 2vh, 16px); line-height: 1.6; }
  .score-line { font-size: clamp(20px, 3vh, 28px); color: #e2d9ff; }
  .score-line b { color: #fbbf24; font-size: clamp(32px, 5vh, 44px); }
  .rank { font-size: clamp(22px, 3.5vh, 30px); font-weight: 800; color: #86efac; }
  .mode-tag { font-size: clamp(14px, 2.2vh, 18px); color: #a78bfa; font-weight: 700; }

  /* ============ 游戏页 ============ */
  #gameScreen {
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 1vh 2vw 2vh 2vw;
    height: 100vh;
  }

  /* 顶部 HUD */
  .hud { width: 100%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 0 auto; flex-shrink: 0; }
  .hud-left { display: flex; align-items: center; gap: 14px; flex: 1; }
  .qcount { font-size: clamp(14px, 2vh, 18px); color: #b9aee0; white-space: nowrap; }
  .qcount b { color: #fbbf24; font-size: clamp(16px, 2.5vh, 22px); }
  .progress { flex: 1; max-width: 400px; height: 10px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg,#a78bfa,#f472b6); transition: width .35s ease; }
  .stars { font-size: clamp(15px, 2.2vh, 20px); font-weight: 800; color: #fbbf24; background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.35); padding: 6px 20px; border-radius: 999px; white-space: nowrap; }

  /* 题目 */
  .prompt { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; text-align: center; margin: 1vh 0; flex-shrink: 0; }
  #promptText { font-size: clamp(20px, 3.5vh, 32px); font-weight: 800; line-height: 1.3; }
  #promptText .en { color: #fff; }
  #promptText .zh { font-size: clamp(14px, 2.2vh, 18px); color: #9d8fce; font-weight: 600; margin-left: 8px; }
  .speaker {
    width: clamp(36px, 5vh, 48px); height: clamp(36px, 5vh, 48px); border-radius: 50%; border: 2px solid rgba(167,139,250,.5);
    background: rgba(167,139,250,.15); color: #fff; font-size: clamp(18px, 2.5vh, 24px); cursor: pointer; transition: .15s;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .speaker:hover { background: rgba(167,139,250,.35); transform: scale(1.08); }
  .speaker:active { transform: scale(.94); }

  /* 场景容器：自适应占据剩余空间，并绝对防止越界 */
  .scene-wrap { 
    position: relative; width: 100%; max-width: 1400px; flex: 1; min-height: 0; 
    margin: 0 auto; overflow: hidden;
  }
  .scene {
    position: absolute; left: 0; top: 0;
    width: 900px; height: 520px;
    background: #120a24; border-radius: 18px; overflow: hidden;
    transform-origin: top left;
    box-shadow: 0 22px 60px rgba(0,0,0,.65), 0 0 0 3px rgba(167,139,250,.3);
    touch-action: none;
    transition: transform 0.2s ease-out, left 0.2s ease-out, top 0.2s ease-out;
  }

  /* 场景内部元素保持绝对定位不变 */
  .wall { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 12%, rgba(167,139,250,.22), transparent 70%), linear-gradient(180deg, #2a1a45 0%, #1a1030 55%, #0e0818 100%); }
  .spotlight { position: absolute; left: 50%; top: -60px; width: 620px; height: 470px; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 0%, rgba(255,240,200,.22), transparent 65%); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%); pointer-events: none; }
  .curtain-l, .curtain-r { position: absolute; top: 0; width: 108px; height: 340px; z-index: 5; background: repeating-linear-gradient(90deg, #7f1d1d 0 14px, #a52a2a 14px 28px); }
  .curtain-l { left: 0; border-radius: 0 0 70px 0; box-shadow: 8px 0 20px rgba(0,0,0,.55); }
  .curtain-r { right: 0; border-radius: 0 0 0 70px; box-shadow: -8px 0 20px rgba(0,0,0,.55); }
  .curtain-top { position: absolute; top: 0; left: 0; width: 900px; height: 54px; z-index: 6; background: repeating-linear-gradient(90deg, #7f1d1d 0 16px, #a52a2a 16px 32px); border-bottom: 4px solid #d4af37; }
  .stage-floor { position: absolute; left: 0; top: 364px; width: 900px; height: 156px; z-index: 2; background-image: linear-gradient(180deg, rgba(255,230,170,.14) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.62) 100%), repeating-linear-gradient(90deg, #7d5829 0 42px, #6a471e 42px 46px, #7d5829 46px 88px); }
  .stage-mark { position: absolute; left: 450px; top: 470px; width: 186px; height: 116px; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .stage-mark .mark-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px dashed rgba(251,191,36,.85); background: radial-gradient(circle at 50% 45%, rgba(251,191,36,.30) 0%, rgba(251,191,36,.10) 55%, rgba(251,191,36,0) 72%); animation: markPulse 2.4s ease-in-out infinite; }
  @keyframes markPulse { 0%,100% { box-shadow: 0 0 26px rgba(251,191,36,.35), inset 0 0 20px rgba(251,191,36,.20); } 50% { box-shadow: 0 0 52px rgba(251,191,36,.65), inset 0 0 34px rgba(251,191,36,.40); } }
  .stage-mark .mark-star { position: relative; z-index: 1; font-size: 30px; line-height: 1; filter: drop-shadow(0 0 12px rgba(251,191,36,.95)); }
  .stage-mark .mark-label { position: relative; z-index: 1; font-size: 12px; font-weight: 900; letter-spacing: 5px; padding-left: 5px; color: #fde68a; text-shadow: 0 0 10px rgba(251,191,36,.9), 0 2px 2px rgba(0,0,0,.5); }
  .stage-edge { position: absolute; left: 0; top: 352px; width: 900px; height: 18px; z-index: 5; background: linear-gradient(180deg, #ffe9a0 0%, #f2c34d 40%, #b8860b 100%); border-radius: 9px 9px 0 0; box-shadow: 0 5px 0 #6b4a10, 0 14px 26px rgba(0,0,0,.55); }
  .stage-edge::before { content: ''; position: absolute; left: 22px; right: 22px; top: 5px; height: 8px; background-image: radial-gradient(circle, #fffbe0 0 2.5px, rgba(255,214,80,.85) 2.5px 4px, transparent 4.5px); background-size: 42px 8px; background-repeat: repeat-x; filter: drop-shadow(0 0 5px rgba(255,220,90,.95)); border-radius: 4px; }
  .table-top { position: absolute; left: 54px; top: 302px; width: 144px; height: 20px; z-index: 15; background: linear-gradient(180deg, #c98a4a, #8a5a22); border-radius: 6px; box-shadow: 0 3px 0 #6a4218; }
  .table-leg { position: absolute; top: 322px; width: 12px; height: 64px; z-index: 16; background: linear-gradient(90deg,#7a4a1a,#5a3410); }
  .table-leg.l { left: 66px; } .table-leg.r { left: 174px; }
  .box-back { position: absolute; left: 234px; top: 322px; width: 100px; height: 68px; z-index: 11; background: linear-gradient(180deg, #5c3a12, #7a4a1a); border-radius: 0 0 8px 8px; box-shadow: inset 0 6px 12px rgba(0,0,0,.6); }
  .box-front { position: absolute; left: 234px; top: 352px; width: 100px; height: 38px; z-index: 13; background: linear-gradient(180deg, #e0a050, #b87b30); border-radius: 0 0 8px 8px; box-shadow: inset 0 3px 0 rgba(255,255,255,.25); }
  .stool { position: absolute; width: 64px; height: 48px; z-index: 14; }
  .stool .seat { position: absolute; top: 0; left: 0; width: 64px; height: 14px; background: linear-gradient(180deg, #e0b080, #b08050); border-radius: 7px; box-shadow: 0 2px 0 #8a6030; }
  .stool .leg { position: absolute; top: 14px; width: 8px; height: 34px; background: linear-gradient(90deg,#a07850,#7a5530); }
  .stool .leg.l { left: 8px; } .stool .leg.r { right: 8px; }
  .s1 { left: 360px; top: 342px; } .s2 { left: 494px; top: 342px; }
  .step { position: absolute; z-index: 12; background: linear-gradient(180deg, #9a7040, #6a4a22); border-radius: 3px 3px 0 0; box-shadow: inset 0 3px 0 rgba(255,255,255,.16); }
  .st0 { left: 675px; top: 357px; width: 35px; height: 33px; } .st1 { left: 640px; top: 325px; width: 35px; height: 65px; } .st2 { left: 605px; top: 292px; width: 35px; height: 98px; } .st3 { left: 570px; top: 260px; width: 35px; height: 130px; }
  .door-frame { position: absolute; left: 736px; top: 182px; width: 126px; height: 212px; z-index: 17; background: #241505; border: 5px solid #6a4a2a; border-radius: 8px 8px 0 0; }
  .door-panel { position: absolute; left: 741px; top: 187px; width: 100px; height: 207px; z-index: 18; background: linear-gradient(105deg, #a83232, #7a1f1f); border-radius: 3px; box-shadow: inset -10px 0 18px rgba(0,0,0,.4); }
  .door-panel .knob { position: absolute; right: 12px; top: 96px; width: 13px; height: 13px; background: radial-gradient(circle at 35% 35%, #ffe9a0, #c9a227); border-radius: 50%; }
  
  #jimmy { position: absolute; left: 100px; top: 470px; width: 64px; height: 90px; display: flex; align-items: center; justify-content: center; font-size: 58px; line-height: 1; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center; z-index: 20; cursor: grab; user-select: none; touch-action: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); transition: left .38s cubic-bezier(.34,1.4,.64,1), top .38s cubic-bezier(.34,1.4,.64,1); }
  #jimmy:active { cursor: grabbing; }
  #jimmy.happy { animation: happy .6s ease; }
  @keyframes happy { 0%,100% { transform: translate(-50%,-50%) scale(var(--s,1)); } 40% { transform: translate(-50%,-72%) scale(calc(var(--s,1) * 1.08)); } 70% { transform: translate(-50%,-44%) scale(var(--s,1)); } }
  #jimmy.shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100% { transform: translate(-50%,-50%) scale(var(--s,1)) rotate(0); } 25% { transform: translate(-56%,-50%) scale(var(--s,1)) rotate(-6deg); } 75% { transform: translate(-44%,-50%) scale(var(--s,1)) rotate(6deg); } }

  /* 底部交互区：固定在下方且层级最高，防止被盖住 */
  .bottom-panel {
    width: 100%; max-width: 1400px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 1vh;
    flex-shrink: 0; position: relative; z-index: 10;
  }

  .options { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; min-height: 50px; align-items: center; }
  .opt-btn {
    padding: clamp(10px, 1.5vh, 16px) clamp(24px, 4vw, 48px); 
    font-size: clamp(18px, 2.5vh, 26px); font-weight: 800; font-family: inherit;
    border-radius: 15px; border: 3px solid #6d5bb5; cursor: pointer;
    background: linear-gradient(180deg,#3a2d6b,#2a1f4a); color: #fff; transition: .15s;
    box-shadow: 0 5px 0 #1a1030;
  }
  .opt-btn:hover:not(:disabled) { transform: translateY(-3px); border-color: #a78bfa; box-shadow: 0 8px 0 #1a1030; }
  .opt-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #1a1030; }
  .opt-btn.correct { background: linear-gradient(180deg,#22c55e,#15803d); border-color: #4ade80; box-shadow: 0 5px 0 #14532d; }
  .opt-btn.wrong { background: linear-gradient(180deg,#7f1d1d,#450a0a); border-color: #f87171; opacity: .55; box-shadow: 0 5px 0 #2a0505; }

  .feedback { min-height: 30px; text-align: center; font-size: clamp(18px, 2.5vh, 24px); font-weight: 800; line-height: 1.3; padding: 0 10px; }
  .feedback.good { color: #4ade80; text-shadow: 0 0 20px rgba(74,222,128,.5); }
  .feedback.bad { color: #fb7185; }

  .nav-controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nav-btn {
    padding: clamp(8px, 1.2vh, 12px) clamp(20px, 3vw, 36px); 
    font-size: clamp(15px, 2.2vh, 20px); font-weight: 800; font-family: inherit;
    border-radius: 12px; border: 2px solid rgba(167,139,250,.45);
    background: rgba(167,139,250,.12); color: #c4b5fd;
    cursor: pointer; transition: .15s;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(167,139,250,.28); transform: translateY(-2px); }
  .nav-btn:active:not(:disabled) { transform: translateY(1px); }
  .nav-btn:disabled { opacity: .32; cursor: not-allowed; }
  .nav-btn.primary-nav { background: linear-gradient(180deg,#fde68a,#f59e0b); color: #1a1030; border-color: #fcd34d; box-shadow: 0 3px 0 #b45309; }
  .nav-btn.primary-nav:hover:not(:disabled) { box-shadow: 0 5px 0 #b45309; }
  .nav-btn.end-nav { border-color: rgba(248,113,113,.5); color: #fca5a5; background: rgba(248,113,113,.1); }
  .nav-btn.end-nav:hover { background: rgba(248,113,113,.25); }
  .nav-btn.reveal-nav { background: linear-gradient(180deg,#86efac,#22c55e); color: #052e16; border-color: #4ade80; box-shadow: 0 3px 0 #15803d; }
  .nav-btn.reveal-nav:hover { box-shadow: 0 5px 0 #15803d; }
  .nav-btn.pulse { animation: navPulse 1.2s ease-in-out infinite; }
  @keyframes navPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.7), 0 3px 0 #b45309; } 50% { box-shadow: 0 0 0 10px rgba(251,191,36,0), 0 3px 0 #b45309; } }
</style>
</head>
<body>

<div class="screen" id="startScreen">
  <div class="logo">🤡</div>
  <h1>Where Is the Clown?</h1>
  <p class="sub">小丑的剧场方位大冒险 · 选择玩法</p>
  <div class="prep-chips">
    <span>on</span><span>in</span><span>under</span><span>behind</span>
    <span>between</span><span>over</span><span>in front of</span><span>up</span><span>down</span>
  </div>
  <div class="mode-list">
    <button class="mode-card drag" id="modeDragBtn">
      <span class="icon">🎪</span>
      <span class="title">拖拽挑战</span>
      <span class="desc">听句子，把小丑拖到正确位置<br>练听力 + 认位置</span>
    </button>
    <button class="mode-card pick" id="modePickBtn">
      <span class="icon">🔍</span>
      <span class="title">看图选介词</span>
      <span class="desc">看小丑在哪，选出正确的介词<br>练观察 + 说方位</span>
    </button>
    <button class="mode-card free" id="modeFreeBtn">
      <span class="icon">🎭</span>
      <span class="title">自由摆放</span>
      <span class="desc">老师随意摆放小丑<br>先提问，再揭晓答案</span>
    </button>
  </div>
  <p class="hint">前两种玩法各 10 题，可手动切换上一题 / 下一题</p>
</div>

<div class="screen hidden" id="gameScreen">
  <div class="hud">
    <div class="hud-left">
      <span class="qcount" id="qcountSpan">第 <b id="qNum">1</b> / <b id="qTotal">10</b> 题</span>
      <div class="progress" id="progressWrap"><div class="bar" id="progressBar"></div></div>
      <span class="qcount hidden" id="freeModeTag">🎭 自由摆放模式 · 任意拖拽小丑</span>
    </div>
    <span class="stars" id="starsPill">⭐ <b id="starCount">0</b></span>
  </div>

  <div class="prompt">
    <span id="promptText">Listen and place the clown!</span>
    <button class="speaker" id="speakBtn" title="再听一遍">🔊</button>
  </div>

  <div class="scene-wrap" id="sceneWrap">
    <div class="scene" id="scene">
      <div class="wall"></div>
      <div class="spotlight"></div>
      <div class="stage-floor"></div>
      <div class="stage-mark">
        <div class="mark-ring"></div>
        <div class="mark-star">⭐</div>
        <div class="mark-label">STAGE</div>
      </div>
      <div class="stage-edge"></div>

      <div class="table-top"></div>
      <div class="table-leg l"></div>
      <div class="table-leg r"></div>

      <div class="box-back"></div>
      <div class="box-front"></div>

      <div class="stool s1"><div class="seat"></div><div class="leg l"></div><div class="leg r"></div></div>
      <div class="stool s2"><div class="seat"></div><div class="leg l"></div><div class="leg r"></div></div>

      <div class="step st0"></div>
      <div class="step st1"></div>
      <div class="step st2"></div>
      <div class="step st3"></div>

      <div class="door-frame"></div>
      <div class="door-panel"><div class="knob"></div></div>

      <div class="curtain-l"></div>
      <div class="curtain-r"></div>
      <div class="curtain-top"></div>

      <div id="jimmy">🤡</div>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>

    <div class="nav-controls" id="quizControls">
      <button class="nav-btn" id="prevBtn">← 上一题</button>
      <button class="nav-btn primary-nav" id="nextBtn">下一题 →</button>
      <button class="nav-btn end-nav" id="endBtn">结束</button>
    </div>

    <div class="nav-controls hidden" id="freeControls">
      <button class="nav-btn reveal-nav" id="revealBtn">🎯 检测位置</button>
      <button class="nav-btn" id="resetBtn">↺ 重置</button>
      <button class="nav-btn end-nav" id="freeHomeBtn">🏠 回到主页</button>
    </div>
  </div>
</div>

<div class="screen hidden" id="endScreen">
  <div class="logo">🎉</div>
  <h1>Great Job!</h1>
  <p class="mode-tag" id="endModeTag"></p>
  <p class="score-line">你获得了 <b id="finalStars">0</b> 颗星星</p>
  <p class="rank" id="rankText"></p>
  <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:16px;">
    <button class="btn primary" id="replayBtn">再玩一次 🔄</button>
    <button class="btn ghost" id="menuBtn">🏠 回到主页</button>
  </div>
</div>

<script>
const POSITIONS = [
  { key:'onStage',       x:450, y:470, scale:1,   z:20, prep:'on',          target:'the stage',  sentence:'The clown is on the stage.' },
  { key:'onTable',       x:126, y:273, scale:1,   z:20, prep:'on',          target:'the table',  sentence:'The clown is on the table.' },
  { key:'inBox',         x:284, y:350, scale:0.6, z:12, prep:'in',          target:'the box',    sentence:'The clown is in the box.' },
  { key:'underTable',    x:126, y:358, scale:0.7, z:10, prep:'under',       target:'the table',  sentence:'The clown is under the table.' },
  { key:'behindDoor',    x:755, y:330, scale:1,   z:16, prep:'behind',      target:'the door',
    sentence:'The clown is behind the door.', judgeX:800, judgeY:330, judgeR:75 },
  { key:'betweenStools', x:459, y:342, scale:1,   z:20, prep:'between',     target:'the stools', sentence:'The clown is between the stools.' },
  { key:'overStool',     x:392, y:275, scale:1,   z:20, prep:'over',        target:'the stool',  sentence:'The clown is over the stool.' },
  { key:'upStairs',      x:595, y:230, scale:1,   z:20, prep:'up',          target:'the stairs', sentence:'The clown is going up the stairs.' },
  { key:'downStairs',    x:685, y:345, scale:1,   z:20, prep:'down',        target:'the stairs', sentence:'The clown is coming down the stairs.' },
  { key:'inFrontDoor',   x:799, y:430, scale:1,   z:20, prep:'in front of', target:'the door',   sentence:'The clown is in front of the door.' },
];

const START_POS = { x:100, y:470, scale:1, z:20 };
const ALL_PREPS = ['on','in','under','behind','between','over','in front of','up','down'];
const HIT_RADIUS = 70;
const MODE_LABEL = { place: '🎪 拖拽挑战', choose: '🔍 看图选介词', free: '🎭 自由摆放' };

const PATH_ANIMS = {
  upStairs: {
    points: [
      { x: 705, y: 348 }, { x: 670, y: 315 }, { x: 635, y: 282 },
      { x: 605, y: 252 }, { x: 595, y: 230 }
    ],
    duration: 1150, easing: 'cubic-bezier(.35,.65,.4,1)'
  },
  downStairs: {
    points: [
      { x: 590, y: 232 }, { x: 622, y: 268 },
      { x: 655, y: 305 }, { x: 685, y: 345 }
    ],
    duration: 1050, easing: 'cubic-bezier(.5,0,.75,.55)'
  },
  overStool: {
    points: [
      { x: 300, y: 361 }, { x: 338, y: 282 },
      { x: 392, y: 232 }, { x: 392, y: 275 }
    ],
    duration: 1200, easing: 'cubic-bezier(.2,.8,.35,1)'
  },
  behindDoor: {
    points: [
      { x: 660, y: 330 }, { x: 860, y: 330 }, { x: 755, y: 330 }
    ],
    duration: 1200, easing: 'ease-in-out'
  }
};

const $ = id => document.getElementById(id);
const startScreen = $('startScreen'), gameScreen = $('gameScreen'), endScreen = $('endScreen');
const scene = $('scene'), sceneWrap = $('sceneWrap'), jimmy = $('jimmy');
const promptText = $('promptText'), speakBtn = $('speakBtn');
const optionsEl = $('options'), feedbackEl = $('feedback');
const qNumEl = $('qNum'), qTotalEl = $('qTotal'), starCountEl = $('starCount'), progressBar = $('progressBar');
const qcountSpan = $('qcountSpan'), progressWrap = $('progressWrap'), freeModeTag = $('freeModeTag'), starsPill = $('starsPill');
const quizControls = $('quizControls'), freeControls = $('freeControls');
const prevBtn = $('prevBtn'), nextBtn = $('nextBtn'), endBtn = $('endBtn');

const state = {
  questions: [], correctFlags: [], index: 0, stars: 0,
  phase: 'idle', current: null, mode: 'place'
};
let currentScale = 1;
let questionToken = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let actx = null;
function getCtx() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, start, dur, type = 'sine', vol = 0.12) {
  const ctx = getCtx(); if (!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function playCorrect() { tone(523.25, 0, 0.12); tone(659.25, 0.10, 0.12); tone(783.99, 0.20, 0.22); }
function playWrong() { tone(311.13, 0, 0.15, 'triangle', 0.1); tone(233.08, 0.13, 0.26, 'triangle', 0.1); }

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.05;
    const voices = window.speechSynthesis.getVoices();
    const en = voices.find(v => /en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    if (en) u.voice = en;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

// ==========================================
// 动态填满剩余空间（并加入防裁切留白）
// ==========================================
function fitScene() {
  if (gameScreen.classList.contains('hidden')) return;
  const rect = sceneWrap.getBoundingClientRect();
  
  // 留出 20px 的边界保护，避免阴影和描边被父容器裁切
  const availW = rect.width - 20; 
  const availH = rect.height - 20; 
  
  if (availW <= 0 || availH <= 0) return;

  let s = Math.min(availW / 900, availH / 520);
  s = Math.max(s, 0.2); 

  currentScale = s;
  const sw = 900 * s;
  const sh = 520 * s;
  
  scene.style.transform = `scale(${s})`;
  scene.style.left = Math.max(0, (rect.width - sw) / 2) + 'px';
  scene.style.top = Math.max(0, (rect.height - sh) / 2) + 'px';
}

// 监听 window 变化
window.addEventListener('resize', fitScene);

// 监听容器自身的变化（当选项按钮出现挤压空间时，自动重新计算缩放）
const resizeObserver = new ResizeObserver(() => {
  fitScene();
});
resizeObserver.observe(sceneWrap);

function placeJimmy(p, animate = true) {
  jimmy.style.transition = animate
    ? 'left .38s cubic-bezier(.34,1.4,.64,1), top .38s cubic-bezier(.34,1.4,.64,1)'
    : 'none';
  jimmy.style.left = p.x + 'px';
  jimmy.style.top = p.y + 'px';
  jimmy.style.zIndex = p.z ?? 20;
  jimmy.style.setProperty('--s', p.scale ?? 1);
}

function runPathAnim(q, done) {
  const cfg = PATH_ANIMS[q.key];
  const pts = cfg.points;
  const total = pts.length - 1;

  jimmy.style.transition = 'none';
  jimmy.style.zIndex = q.z;
  jimmy.style.setProperty('--s', q.scale);
  jimmy.style.left = pts[0].x + 'px';
  jimmy.style.top = pts[0].y + 'px';

  const keyframes = pts.map((p, i) => ({
    left: p.x + 'px',
    top: p.y + 'px',
    offset: i / total,
    transform: `translate(-50%,-50%) scale(${q.scale})`
  }));

  const anim = jimmy.animate(keyframes, {
    duration: cfg.duration,
    easing: cfg.easing,
    fill: 'forwards'
  });

  anim.onfinish = () => {
    placeJimmy(q, false);
    anim.cancel();
    if (done) done();
  };
}

function enterPosition(q, done) {
  if (PATH_ANIMS[q.key]) {
    runPathAnim(q, done);
  } else {
    placeJimmy(q, true);
    setTimeout(done, 420);
  }
}

let dragging = false, didDrag = false;
let dragOffsetX = 0, dragOffsetY = 0;
let downX = 0, downY = 0;

scene.addEventListener('pointerdown', () => { didDrag = false; }, true);

jimmy.addEventListener('pointerdown', e => {
  if (state.phase !== 'place' && state.phase !== 'free') return;
  e.preventDefault();
  dragging = true; didDrag = false;
  downX = e.clientX; downY = e.clientY;

  const rect = scene.getBoundingClientRect();
  const jx = parseFloat(jimmy.style.left) || START_POS.x;
  const jy = parseFloat(jimmy.style.top) || START_POS.y;
  dragOffsetX = (e.clientX - rect.left) / currentScale - jx;
  dragOffsetY = (e.clientY - rect.top) / currentScale - jy;

  jimmy.style.transition = 'none';
  jimmy.style.zIndex = 100;
  try { jimmy.setPointerCapture(e.pointerId); } catch (err) {}
});

jimmy.addEventListener('pointermove', e => {
  if (!dragging) return;
  e.preventDefault();
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) didDrag = true;

  const rect = scene.getBoundingClientRect();
  let nx = (e.clientX - rect.left) / currentScale - dragOffsetX;
  let ny = (e.clientY - rect.top) / currentScale - dragOffsetY;
  nx = Math.max(24, Math.min(876, nx));
  ny = Math.max(24, Math.min(496, ny));
  jimmy.style.left = nx + 'px';
  jimmy.style.top = ny + 'px';
});

function endDrag() {
  if (!dragging) return;
  dragging = false;
  jimmy.style.transition = 'left .38s cubic-bezier(.34,1.4,.64,1), top .38s cubic-bezier(.34,1.4,.64,1)';
  if (didDrag && state.phase === 'place') {
    judgeDrop(parseFloat(jimmy.style.left), parseFloat(jimmy.style.top));
  }
}
jimmy.addEventListener('pointerup', endDrag);
jimmy.addEventListener('pointercancel', endDrag);

scene.addEventListener('click', e => {
  if (didDrag) { didDrag = false; return; }
  if (e.target.closest('#jimmy')) return;
  const rect = scene.getBoundingClientRect();
  const x = (e.clientX - rect.left) / currentScale;
  const y = (e.clientY - rect.top) / currentScale;
  if (state.phase === 'place') {
    judgeDrop(x, y);
  } else if (state.phase === 'free') {
    placeJimmy({ x, y, scale: 1, z: 20 }, true);
  }
});

function judgeDrop(x, y) {
  if (state.phase !== 'place') return;
  const target = state.current;
  const tx = target.judgeX ?? target.x;
  const ty = target.judgeY ?? target.y;
  const tr = target.judgeR ?? HIT_RADIUS;
  const dist = Math.hypot(x - tx, y - ty);

  if (dist <= tr) {
    success(target);
  } else {
    playWrong();
    jimmy.classList.add('shake');
    setTimeout(() => jimmy.classList.remove('shake'), 420);
    showFeedback('位置不对，再仔细听一听～', 'bad');
    setTimeout(() => {
      if (state.phase === 'place') placeJimmy(START_POS);
    }, 420);
  }
}

function detectPosition(x, y) {
  const bottom = y + 29;
  const top = y - 29;

  const TABLE  = { x1: 54,  x2: 198, top: 302, bottom: 386 };
  const BOX    = { x1: 234, x2: 334, top: 322, bottom: 390 };
  const S1     = { x1: 360, x2: 424, top: 342, bottom: 390 };
  const S2     = { x1: 494, x2: 558, top: 342, bottom: 390 };
  const DOOR   = { x1: 736, x2: 862, top: 182, bottom: 394 };
  const STAIRS = { x1: 570, x2: 710, top: 260, bottom: 390 };

  if (x > BOX.x1 + 15 && x < BOX.x2 - 15 &&
      bottom > BOX.top + 25 && bottom < BOX.bottom + 22) {
    return { prep: 'in', target: 'the box', sentence: 'The clown is in the box.' };
  }

  if (x >= 194 && x <= 238 && y >= 330 && y <= 420) {
    return { prep: 'between', target: 'the table and the box',
             sentence: 'The clown is between the table and the box.' };
  }
  if (x >= 330 && x <= 364 && y >= 330 && y <= 420) {
    return { prep: 'between', target: 'the box and the stool',
             sentence: 'The clown is between the box and the stool.' };
  }
  if (x >= 420 && x <= 498 && y >= 270 && y <= 420) {
    return { prep: 'between', target: 'the stools',
             sentence: 'The clown is between the stools.' };
  }

  if (x > TABLE.x1 - 10 && x < TABLE.x2 + 10) {
    if (Math.abs(bottom - TABLE.top) < 22) {
      return { prep: 'on', target: 'the table', sentence: 'The clown is on the table.' };
    }
    if (y > TABLE.top + 25 && y < 375) {
      return { prep: 'under', target: 'the table', sentence: 'The clown is under the table.' };
    }
    if (y >= 375 && y < 490) {
      return { prep: 'in front of', target: 'the table', sentence: 'The clown is in front of the table.' };
    }
  }

  const inS1 = x > S1.x1 - 15 && x < S1.x2 + 15;
  const inS2 = x > S2.x1 - 15 && x < S2.x2 + 15;
  if (inS1 || inS2) {
    if (Math.abs(bottom - 342) < 22) {
      return { prep: 'on', target: 'the stool', sentence: 'The clown is on the stool.' };
    }
    if (bottom < 342 - 15 && top > 220) {
      return { prep: 'over', target: 'the stool', sentence: 'The clown is over the stool.' };
    }
    if (y > 370) {
      return { prep: 'under', target: 'the stool', sentence: 'The clown is under the stool.' };
    }
  }

  if (x > DOOR.x1 - 20 && x < DOOR.x2 + 20) {
    if (y > DOOR.top + 20 && y < 370) {
      return { prep: 'behind', target: 'the door', sentence: 'The clown is behind the door.' };
    }
    if (y >= 370 && y < 510) {
      return { prep: 'in front of', target: 'the door', sentence: 'The clown is in front of the door.' };
    }
  }

  if (x > STAIRS.x1 - 15 && x < STAIRS.x2 + 15 && y > 210 && y < STAIRS.bottom + 15) {
    if (y < 310) {
      return { prep: 'up', target: 'the stairs', sentence: 'The clown is going up the stairs.' };
    }
    return { prep: 'down', target: 'the stairs', sentence: 'The clown is coming down the stairs.' };
  }

  if (bottom > 364) {
    return { prep: 'on', target: 'the stage', sentence: 'The clown is on the stage.' };
  }

  return null;
}

function buildQuestions(mode) {
  return shuffle(POSITIONS).map(p => ({ ...p, type: mode }));
}

function updateHUD() {
  qNumEl.textContent = Math.min(state.index + 1, state.questions.length);
  qTotalEl.textContent = state.questions.length;
  starCountEl.textContent = state.stars;
  progressBar.style.width = ((state.index + 1) / state.questions.length * 100) + '%';
}

function updateNavButtons() {
  prevBtn.disabled = state.index <= 0;
  nextBtn.textContent = (state.index >= state.questions.length - 1) ? '完成 ✓' : '下一题 →';
}

function showFeedback(text, cls) {
  feedbackEl.textContent = text;
  feedbackEl.className = 'feedback ' + cls;
}

function clearAnimations() {
  if (jimmy.getAnimations) jimmy.getAnimations().forEach(a => a.cancel());
}

function loadQuestion(idx) {
  if (idx < 0 || idx >= state.questions.length) return;
  questionToken++;
  const myToken = questionToken;

  clearAnimations();
  jimmy.classList.remove('happy', 'shake');

  state.index = idx;
  const q = state.questions[idx];
  state.current = q;
  state.phase = q.type === 'place' ? 'place' : 'choose';

  optionsEl.innerHTML = '';
  showFeedback('');
  updateHUD();
  updateNavButtons();
  nextBtn.classList.remove('pulse');

  if (q.type === 'place') {
    placeJimmy(START_POS, false);
    promptText.innerHTML = `<span class="en">${q.sentence}</span>`;
    speakBtn.style.display = 'inline-flex';
    setTimeout(() => { if (myToken === questionToken) speak(q.sentence); }, 220);
  } else {
    promptText.innerHTML = `<span class="en">Where is the clown?</span><span class="zh">选出正确的介词</span>`;
    speakBtn.style.display = 'none';
    placeJimmy(START_POS, false);
    setTimeout(() => {
      if (myToken !== questionToken) return;
      enterPosition(q, () => {
        if (myToken !== questionToken) return;
        buildOptions(q);
      });
    }, 140);
  }
}

function buildOptions(q) {
  const distractors = shuffle(ALL_PREPS.filter(p => p !== q.prep)).slice(0, 2);
  const opts = shuffle([q.prep, ...distractors]);

  optionsEl.innerHTML = '';
  opts.forEach(prep => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = prep;
    btn.addEventListener('click', () => {
      if (state.phase !== 'choose') return;
      if (prep === q.prep) {
        btn.classList.add('correct');
        success(q);
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        playWrong();
        showFeedback('再想想～ 看看小丑在哪里', 'bad');
      }
    });
    optionsEl.appendChild(btn);
  });
}

function success(q) {
  if (state.phase === 'feedback') return;
  state.phase = 'feedback';

  placeJimmy(q, true);
  playCorrect();

  if (!state.correctFlags[state.index]) {
    state.correctFlags[state.index] = true;
    state.stars++;
  }
  updateHUD();

  jimmy.classList.add('happy');
  setTimeout(() => jimmy.classList.remove('happy'), 620);

  showFeedback('✓ ' + q.sentence, 'good');
  speak(q.sentence);

  optionsEl.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  nextBtn.classList.add('pulse');
}

prevBtn.addEventListener('click', () => {
  if (state.phase === 'free') return;
  if (state.index > 0) loadQuestion(state.index - 1);
});

nextBtn.addEventListener('click', () => {
  if (state.phase === 'free') return;
  if (state.index >= state.questions.length - 1) {
    endGame();
  } else {
    loadQuestion(state.index + 1);
  }
});

endBtn.addEventListener('click', endGame);

function setupFreeMode() {
  clearAnimations();
  state.phase = 'free';
  state.current = null;
  questionToken++;

  qcountSpan.classList.add('hidden');
  progressWrap.classList.add('hidden');
  freeModeTag.classList.remove('hidden');
  starsPill.classList.add('hidden');
  quizControls.classList.add('hidden');
  freeControls.classList.remove('hidden');

  optionsEl.innerHTML = '';
  showFeedback('');
  promptText.innerHTML = `<span class="en">Where is the clown?</span>`;
  speakBtn.style.display = 'none';

  requestAnimationFrame(() => {
    fitScene();
    placeJimmy(START_POS, false);
  });
}

$('revealBtn').addEventListener('click', () => {
  if (state.phase !== 'free') return;
  const jx = parseFloat(jimmy.style.left) || START_POS.x;
  const jy = parseFloat(jimmy.style.top) || START_POS.y;

  const result = detectPosition(jx, jy);

  if (result) {
    showFeedback('✓ ' + result.sentence, 'good');
    speak(result.sentence);
    jimmy.classList.add('happy');
    setTimeout(() => jimmy.classList.remove('happy'), 620);
  } else {
    showFeedback('小丑悬空啦，放到某个道具旁边试试～', 'bad');
  }
});

$('resetBtn').addEventListener('click', () => {
  if (state.phase !== 'free') return;
  placeJimmy(START_POS, true);
  showFeedback('');
  jimmy.classList.remove('happy', 'shake');
});

$('freeHomeBtn').addEventListener('click', backToHome);

function endGame() {
  if (state.phase === 'free') { backToHome(); return; }
  state.phase = 'done';
  clearAnimations();
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');

  $('endModeTag').textContent = MODE_LABEL[state.mode] + ' · 完成';
  $('finalStars').textContent = state.stars;
  const r = state.stars;
  let text = '';
  if (r >= 9) text = '🏆 方位小侦探！Perfect!';
  else if (r >= 7) text = '🌟 太棒了！Excellent!';
  else if (r >= 5) text = '👍 做得不错！Good job!';
  else text = '💪 再试一次吧！Try again!';
  $('rankText').textContent = text;
}

function startGame(mode) {
  getCtx();
  clearAnimations();

  state.mode = mode;
  state.stars = 0;
  state.phase = 'idle';

  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');

  if (mode === 'free') {
    setupFreeMode();
    return;
  }

  state.questions = buildQuestions(mode);
  state.correctFlags = new Array(state.questions.length).fill(false);
  state.index = 0;

  qcountSpan.classList.remove('hidden');
  progressWrap.classList.remove('hidden');
  freeModeTag.classList.add('hidden');
  starsPill.classList.remove('hidden');
  quizControls.classList.remove('hidden');
  freeControls.classList.add('hidden');

  requestAnimationFrame(() => {
    fitScene();
    placeJimmy(START_POS, false);
    setTimeout(() => loadQuestion(0), 260);
  });
}

function backToHome() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  clearAnimations();
  state.phase = 'idle';
  gameScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
}

$('modeDragBtn').addEventListener('click', () => startGame('place'));
$('modePickBtn').addEventListener('click', () => startGame('choose'));
$('modeFreeBtn').addEventListener('click', () => startGame('free'));
$('replayBtn').addEventListener('click', () => startGame(state.mode));
$('menuBtn').addEventListener('click', backToHome);

speakBtn.addEventListener('click', () => {
  if (state.current) speak(state.current.sentence);
  else speak('Where is the clown?');
});
